<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30">
  <!-- FIRSTWAKE HUD compass finial (original, in-repo): a brass spear-tip pointing left with a ring and a fading
       rule toward the strip. The right end is the same image mirrored in CSS. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d89e"/>
      <stop offset=".55" stop-color="#b48c45"/>
      <stop offset="1" stop-color="#644922"/>
    </linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a35a" stop-opacity=".85"/>
      <stop offset="1" stop-color="#c9a35a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M1 15 7.5 10.4 13.5 15 7.5 19.6Z" fill="url(#g)" stroke="#1d150b" stroke-width=".7" stroke-linejoin="round"/>
  <path d="M5.2 15h4.6" stroke="#2a1f10" stroke-opacity=".6" stroke-width=".7"/>
  <path d="M13.5 15h3.2" stroke="#b48c45" stroke-width="1.2"/>
  <circle cx="18.6" cy="15" r="1.7" fill="none" stroke="url(#g)" stroke-width="1.1"/>
  <rect x="20.6" y="14.5" width="9.4" height="1" fill="url(#r)"/>
</svg>
