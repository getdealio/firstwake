<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30">
  <!-- original, FIRSTWAKE, 2026-10 -->
  <!-- HUD compass finial: an iron spear-tip pointing left with a brass rivet, an iron ring and an iron rule fading
       toward the strip. The right end is the same image mirrored in CSS. -->
  <defs>
    <linearGradient id="i" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8088"/>
      <stop offset=".55" stop-color="#3f444b"/>
      <stop offset="1" stop-color="#1c1f23"/>
    </linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a9098" stop-opacity=".85"/>
      <stop offset="1" stop-color="#8a9098" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M1 15 7.5 10.2 13.6 15 7.5 19.8Z" fill="url(#i)" stroke="#0d0e10" stroke-width=".7" stroke-linejoin="round"/>
  <path d="M2.6 14.6 7.5 11" stroke="#b4bac2" stroke-opacity=".35" stroke-width=".5"/>
  <circle cx="7.6" cy="15" r="1.1" fill="#b08d4a" stroke="#1a140a" stroke-width=".4"/>
  <path d="M13.6 15h3.1" stroke="#5a6068" stroke-width="1.2"/>
  <circle cx="18.6" cy="15" r="1.8" fill="none" stroke="url(#i)" stroke-width="1.2"/>
  <rect x="20.6" y="14.5" width="9.4" height="1" fill="url(#r)"/>
</svg>
