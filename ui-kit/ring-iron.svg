<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- original, FIRSTWAKE, 2026-10 -->
  <!-- HUD technique bezel: a ring of dark weathered iron with stone grain, an engraved inner cut, eight iron hour ticks
       and four brass rivets on the quarters. Drawn over the technique ring; the centre stays clear for the glyph. -->
  <defs>
    <linearGradient id="i" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0" stop-color="#6a7078"/>
      <stop offset=".5" stop-color="#3f444b"/>
      <stop offset="1" stop-color="#1c1f23"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3cc96"/>
      <stop offset=".5" stop-color="#b08d4a"/>
      <stop offset="1" stop-color="#5c4520"/>
    </linearGradient>
    <filter id="g" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 .8 0 0 0 0 .81 0 0 0 0 .83 0 0 0 -1.7 1.1"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <path id="t" d="M32 5.2v2"/>
    <circle id="r" cx="32" cy="2.2" r="1.7" fill="url(#b)" stroke="#1a140a" stroke-width=".5"/>
  </defs>
  <g fill="none">
    <circle cx="32" cy="32" r="31.4" stroke="#121417" stroke-opacity=".85" stroke-width=".8"/>
    <circle cx="32" cy="32" r="29.9" stroke="url(#i)" stroke-width="2.6"/>
    <circle cx="32" cy="32" r="29.9" stroke="#fff" stroke-width="2.6" filter="url(#g)" opacity=".24"/>
    <circle cx="32" cy="32" r="28.1" stroke="#0b0c0e" stroke-opacity=".65"/>
    <circle cx="32" cy="32" r="27.2" stroke="#a7adb5" stroke-opacity=".14" stroke-width=".8"/>
    <g stroke="#8a9098" stroke-opacity=".5" stroke-width="1.1" stroke-linecap="round">
      <use href="#t" transform="rotate(30 32 32)"/>
      <use href="#t" transform="rotate(60 32 32)"/>
      <use href="#t" transform="rotate(120 32 32)"/>
      <use href="#t" transform="rotate(150 32 32)"/>
      <use href="#t" transform="rotate(210 32 32)"/>
      <use href="#t" transform="rotate(240 32 32)"/>
      <use href="#t" transform="rotate(300 32 32)"/>
      <use href="#t" transform="rotate(330 32 32)"/>
    </g>
  </g>
  <use href="#r"/>
  <use href="#r" transform="rotate(90 32 32)"/>
  <use href="#r" transform="rotate(180 32 32)"/>
  <use href="#r" transform="rotate(270 32 32)"/>
</svg>
