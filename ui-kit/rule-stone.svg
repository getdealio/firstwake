<svg xmlns="http://www.w3.org/2000/svg" width="160" height="10" viewBox="0 0 160 10" preserveAspectRatio="none">
  <!-- original, FIRSTWAKE, 2026-10 -->
  <!-- HUD stone-inlay rule: a strip of grey stone (stone grain from feTurbulence) set between two iron rails, fading at
       both ends, with an iron lozenge at its middle holding one brass rivet. -->
  <defs>
    <linearGradient id="s" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="160" y2="0">
      <stop offset="0" stop-color="#5a564e" stop-opacity="0"/>
      <stop offset=".22" stop-color="#5a564e" stop-opacity=".9"/>
      <stop offset=".78" stop-color="#5a564e" stop-opacity=".9"/>
      <stop offset="1" stop-color="#5a564e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="l" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="160" y2="0">
      <stop offset="0" stop-color="#8a9098" stop-opacity="0"/>
      <stop offset=".25" stop-color="#8a9098" stop-opacity=".8"/>
      <stop offset=".75" stop-color="#8a9098" stop-opacity=".8"/>
      <stop offset="1" stop-color="#8a9098" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="i" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8088"/>
      <stop offset="1" stop-color="#2a2d32"/>
    </linearGradient>
    <filter id="g" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.2 .9" numOctaves="2" seed="2"/>
      <feColorMatrix values="0 0 0 0 .86 0 0 0 0 .84 0 0 0 0 .8 0 0 0 -1.5 1"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect x="2" y="3.4" width="156" height="3.2" fill="url(#s)"/>
  <rect x="2" y="3.4" width="156" height="3.2" fill="url(#s)" filter="url(#g)" opacity=".5"/>
  <rect x="2" y="2.6" width="156" height=".8" fill="url(#l)"/>
  <rect x="2" y="6.6" width="156" height=".8" fill="url(#l)" opacity=".6"/>
  <path d="M80 .6 84.4 5 80 9.4 75.6 5Z" fill="url(#i)" stroke="#0d0e10" stroke-width=".6"/>
  <circle cx="80" cy="5" r="1.2" fill="#b08d4a" stroke="#1a140a" stroke-width=".4"/>
</svg>
